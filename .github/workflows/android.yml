          package com.backpacker.turno;

          import android.content.ContentProvider;
          import android.content.ContentValues;
          import android.content.Context;
          import android.database.Cursor;
          import android.database.MatrixCursor;
          import android.net.Uri;
          import android.os.ParcelFileDescriptor;
          import android.provider.OpenableColumns;

          import java.io.File;
          import java.io.FileNotFoundException;

          public class Files extends ContentProvider {
              static final String AUTH = "com.backpacker.turno.files";

              static Uri uriFor(Context c, File f) {
                  String base = c.getCacheDir().getAbsolutePath();
                  String rel = f.getAbsolutePath().substring(base.length() + 1);
                  Uri.Builder b = new Uri.Builder().scheme("content").authority(AUTH);
                  for (String s : rel.split("/")) b.appendPath(s);
                  return b.build();
              }

              private File fileFor(Uri u) throws FileNotFoundException {
                  File f = getContext().getCacheDir();
                  for (String s : u.getPathSegments()) {
                      if (s.equals("..") || s.equals(".")) throw new FileNotFoundException();
                      f = new File(f, s);
                  }
                  return f;
              }

              @Override public boolean onCreate() { return true; }

              @Override
              public Cursor query(Uri uri, String[] projection, String selection, String[] args, String sort) {
                  File f;
                  try { f = fileFor(uri); } catch (Exception e) { return null; }
                  MatrixCursor c = new MatrixCursor(new String[]{OpenableColumns.DISPLAY_NAME, OpenableColumns.SIZE});
                  c.addRow(new Object[]{f.getName(), f.length()});
                  return c;
              }

              @Override
              public String getType(Uri uri) {
                  String n = uri.getLastPathSegment();
                  if (n == null) return "application/octet-stream";
                  n = n.toLowerCase();
                  if (n.endsWith(".pdf")) return "application/pdf";
                  if (n.endsWith(".json")) return "application/json";
                  return "application/octet-stream";
              }

              @Override
              public ParcelFileDescriptor openFile(Uri uri, String mode) throws FileNotFoundException {
                  File f = fileFor(uri);
                  File p = f.getParentFile();
                  if (p != null) p.mkdirs();
                  return ParcelFileDescriptor.open(f, ParcelFileDescriptor.parseMode(mode));
              }

              @Override public Uri insert(Uri uri, ContentValues v) { return null; }
              @Override public int delete(Uri uri, String s, String[] a) { return 0; }
              @Override public int update(Uri uri, ContentValues v, String s, String[] a) { return 0; }
          }
