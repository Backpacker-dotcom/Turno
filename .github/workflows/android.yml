          cat > $J/Reminder.java <<'EOF'
          package com.backpacker.turno;

          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;

          import org.json.JSONArray;
          import org.json.JSONObject;

          public class Reminder {
              static final String CH = "turno";
              static final String ACTION = "com.backpacker.turno.CHECK";

              static SharedPreferences prefs(Context c) { return c.getSharedPreferences("turno", Context.MODE_PRIVATE); }

              static PendingIntent pi(Context c) {
                  Intent i = new Intent(c, ReminderReceiver.class).setAction(ACTION);
                  return PendingIntent.getBroadcast(c, 1, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              }

              static void schedule(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  if (am == null) return;
                  long now = System.currentTimeMillis(), next = Long.MAX_VALUE;
                  try {
                      JSONArray arr = new JSONArray(prefs(c).getString("items", "[]"));
                      JSONObject done = new JSONObject(prefs(c).getString("done", "{}"));
                      for (int k = 0; k < arr.length(); k++) {
                          JSONObject o = arr.getJSONObject(k);
                          long at = o.optLong("at");
                          if (done.has(o.optString("id"))) continue;
                          if (at > now && at < next) next = at;
                      }
                  } catch (Exception ignored) { }
                  am.cancel(pi(c));
                  if (next != Long.MAX_VALUE) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next, pi(c));
              }

              static void check(Context c) {
                  SharedPreferences p = prefs(c);
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  if (Build.VERSION.SDK_INT >= 26) nm.createNotificationChannel(new NotificationChannel(CH, "Vardiya ve talepler", NotificationManager.IMPORTANCE_DEFAULT));
                  long now = System.currentTimeMillis();
                  try {
                      JSONArray arr = new JSONArray(p.getString("items", "[]"));
                      JSONObject done = new JSONObject(p.getString("done", "{}"));
                      JSONObject keep = new JSONObject();
                      Intent open = new Intent(c, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent cpi = PendingIntent.getActivity(c, 2, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      for (int k = 0; k < arr.length(); k++) {
                          JSONObject o = arr.getJSONObject(k);
                          String id = o.optString("id");
                          long at = o.optLong("at");
                          if (done.has(id)) { keep.put(id, 1); continue; }
                          if (at > now + 60000 || at < now - 6 * 3600000L) continue;
                          String body = o.optString("body");
                          Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, CH) : new Notification.Builder(c);
                          b.setSmallIcon(R.drawable.ic_notify)
                                  .setContentTitle(o.optString("title"))
                                  .setContentText(body)
                                  .setStyle(new Notification.BigTextStyle().bigText(body))
                                  .setColor(0xFFE0583F)
                                  .setAutoCancel(true)
                                  .setContentIntent(cpi);
                          nm.notify(id.hashCode(), b.build());
                          keep.put(id, 1);
                      }
                      p.edit().putString("done", keep.toString()).apply();
                  } catch (Exception ignored) { }
              }
          }
          EOF
          cat > $J/ReminderReceiver.java <<'EOF'
          package com.backpacker.turno;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;

          public class ReminderReceiver extends BroadcastReceiver {
              @Override
              public void onReceive(Context c, Intent i) {
                  Reminder.check(c);
                  Reminder.schedule(c);
              }
          }
